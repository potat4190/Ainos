<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ainos — Worship &amp; Praise</title>
  <meta name="description" content="Ainos — worship, praise and hymns to stream, in six languages.">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to content</a>
  <div id="boot" class="boot" role="status"><span class="spinner" aria-hidden="true"></span><span id="boot-text">Loading Ainos…</span></div>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand brand-lg"><img src="/img/icon.svg" alt="" width="40" height="40"><div><span>Ainos</span><small class="brand-sub" id="login-brand-sub">Worship &amp; Praise</small></div></div>
      <button class="btn btn-primary btn-block btn-lg" type="button" id="demo-login">Try the demo</button>
      <p class="demo-hint" id="demo-hint">No sign-up needed. The demo account is shared and resets each time someone starts it.</p>
      <div class="divider" aria-hidden="true"><span id="login-or">or</span></div>
      <h1 id="login-title">Log in to Ainos</h1>
      <label><span id="lbl-username">Username</span><input name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
      <label class="signup-only" hidden><span id="lbl-displayname">Display name</span><input name="display_name" maxlength="40" autocomplete="nickname"></label>
      <label><span id="lbl-password">Password</span><input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-light btn-block" type="submit" id="login-submit">Log in</button>
      <p class="login-switch"><span id="login-switch-text">Don’t have an account?</span> <button type="button" class="link" id="login-switch">Sign up</button></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <nav class="sidebar" aria-label="Main">
      <div class="panel nav-panel">
        <a class="brand" href="#/"><img src="/img/icon.svg" alt="" width="28" height="28"><div><span>Ainos</span><small class="brand-sub" id="sidebar-brand-sub">Worship &amp; Praise</small></div></a>
        <a class="nav-link" href="#/" data-nav="home"><svg class="icon"><use href="#i-home"/></svg><span id="nav-home-text">Home</span></a>
        <a class="nav-link" href="#/search" data-nav="search"><svg class="icon"><use href="#i-search"/></svg><span id="nav-search-text">Search</span></a>
        <a class="nav-link" href="#/internals" data-nav="internals"><svg class="icon"><use href="#i-cpu"/></svg><span id="nav-internals-text">Under the hood</span></a>
      </div>
      <div class="panel library-panel">
        <div class="library-head">
          <a class="nav-link" href="#/library" data-nav="library"><svg class="icon"><use href="#i-library"/></svg><span id="nav-library-text">Your Library</span></a>
          <button class="icon-btn" id="new-playlist" title="Create playlist" aria-label="Create playlist"><svg class="icon"><use href="#i-plus"/></svg></button>
        </div>
        <div class="library-list" id="library-list"></div>
      </div>
    </nav>

    <main class="main panel" id="main" tabindex="-1">
      <div class="demo-banner" id="demo-banner" role="status" hidden></div>
      <header class="topbar" id="topbar">
        <div class="topbar-nav">
          <button class="round-btn" id="nav-back" aria-label="Go back"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
          <button class="round-btn" id="nav-fwd" aria-label="Go forward"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
        </div>
        <div class="topbar-search" id="topbar-search" hidden>
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="search-input" type="search" placeholder="Search songs, artists or albums…" aria-label="Search" autocomplete="off">
        </div>
        <div class="topbar-user">
          <label class="lang-picker" for="lang-select">
            <span class="sr-only" id="lang-label">Language</span>
            <select id="lang-select" class="lang-select" aria-label="Language">
              <option value="en">English</option>
              <option value="hi">हिन्दी (Hindi)</option>
              <option value="ne">नेपाली (Nepali)</option>
              <option value="zh">中文 (Chinese)</option>
              <option value="ja">日本語 (Japanese)</option>
              <option value="es">Español (Spanish)</option>
            </select>
          </label>
          <button class="avatar" id="user-menu-btn" aria-haspopup="menu" aria-label="Account"></button>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>

    <aside class="rightpanel panel" id="rightpanel" aria-label="Now playing" hidden></aside>

    <footer class="playerbar" id="playerbar">
      <div class="np-left" id="np-left"></div>
      <div class="np-center">
        <div class="controls">
          <button class="icon-btn" id="btn-shuffle" aria-label="Shuffle" aria-pressed="false"><svg class="icon"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" id="btn-prev" aria-label="Previous"><svg class="icon"><use href="#i-prev"/></svg></button>
          <button class="play-btn" id="btn-play" aria-label="Play"><svg class="icon"><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="btn-next" aria-label="Next"><svg class="icon"><use href="#i-next"/></svg></button>
          <button class="icon-btn" id="btn-repeat" aria-label="Repeat" aria-pressed="false"><svg class="icon"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="progress">
          <span class="time" id="time-cur">0:00</span>
          <div class="slider" id="seek" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="slider-buffer" id="seek-buffer"></div><div class="slider-fill" id="seek-fill"></div><div class="slider-thumb" id="seek-thumb"></div>
          </div>
          <span class="time" id="time-dur">0:00</span>
        </div>
      </div>
      <div class="np-right">
        <button class="icon-btn" id="btn-nowplaying" aria-label="Now playing view" aria-pressed="false"><svg class="icon"><use href="#i-nowplaying"/></svg></button>
        <button class="icon-btn" id="btn-queue" aria-label="Queue" aria-pressed="false"><svg class="icon"><use href="#i-queue"/></svg></button>
        <button class="icon-btn" id="btn-devices" aria-label="Connect to a device" aria-pressed="false"><svg class="icon"><use href="#i-devices"/></svg></button>
        <button class="icon-btn" id="btn-mute" aria-label="Mute"><svg class="icon"><use href="#i-volume"/></svg></button>
        <div class="slider volume" id="volume" role="slider" aria-label="Volume" tabindex="0" aria-valuemin="0" aria-valuemax="100">
          <div class="slider-fill" id="volume-fill"></div><div class="slider-thumb" id="volume-thumb"></div>
        </div>
      </div>
      <div class="connect-bar" id="connect-bar" hidden></div>
    </footer>

    <nav class="mobile-nav" aria-label="Main">
      <a href="#/" data-nav="home"><svg class="icon"><use href="#i-home"/></svg><span id="mnav-home-text">Home</span></a>
      <a href="#/search" data-nav="search"><svg class="icon"><use href="#i-search"/></svg><span id="mnav-search-text">Search</span></a>
      <a href="#/library" data-nav="library"><svg class="icon"><use href="#i-library"/></svg><span id="mnav-library-text">Library</span></a>
      <a href="#/internals" data-nav="internals"><svg class="icon"><use href="#i-cpu"/></svg><span id="mnav-internals-text">Internals</span></a>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="menu-root"></div>

  <svg width="0" height="0" class="sprite" aria-hidden="true">

    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" fill="currentColor"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.6 1.9-.6 5.3 17.2-1.9.6z" fill="currentColor"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a.5.5 0 0 0 .76.43l12.5-7.5a.5.5 0 0 0 0-.86L7.76 4.07A.5.5 0 0 0 7 4.5z" fill="currentColor"/></symbol>

</body>
</html>
